
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="contenedor">
    <h1>🌤️ Weather App</h1>

    <form id="form-busqueda" class="busqueda">
      <input
        type="text"
        id="ciudad"
        placeholder="Escribe una ciudad..."
        autocomplete="off"
        aria-label="Ciudad"
      >

      <button type="submit">Buscar</button>

      <div
        id="sugerencias"
        class="sugerencias"
        hidden
      ></div>
    </form>

    <p id="cargando" hidden>Cargando...</p>
    <p id="error" role="alert" hidden></p>

    <section id="tarjeta" class="tarjeta" hidden>
      <h2 id="nombre-ciudad"></h2>

      <p id="temperatura" class="temperatura"></p>

      <div class="estado-clima">
        <span id="emoji-clima" class="emoji-clima"></span>
        <span id="condicion"></span>
      </div>

      <p>💧 Humedad: <span id="humedad"></span></p>
      <p>💨 Viento: <span id="viento"></span></p>
      <p>🌡️ Sensación térmica: <span id="sensacion"></span></p>

      <button id="btn-unidad" type="button">
        Cambiar °C / °F
      </button>
    </section>
  </main>

  <script type="module" src="./service/weather-icons.js"></script>
</body>
</html>
